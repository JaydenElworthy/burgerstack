<!-- PWA Install Prompt Banner for Squarespace Footer -->
<!--
  Paste this entire block into Settings > Advanced > Code Injection > Footer.
  It only shows on mobile browsers that are not already in the installed app.
  It links to the actual PWA at https://burgerstack-five.vercel.app/?source=squarespace
  so the PWA's own install prompt can fire once the user lands there.
-->
<div id="pwa-install-banner" style="display: none; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); width: 92%; max-width: 400px; background-color: #E55937; color: #FFE974; border: 4px solid black; border-radius: 24px; box-shadow: 6px 6px 0px 0px #000; padding: 16px; z-index: 99999; font-family: system-ui, -apple-system, sans-serif; box-sizing: border-box;">
  <div style="display: flex; align-items: center; justify-content: space-between; gap: 12px;">
    <div style="flex: 1;">
      <h4 style="margin: 0 0 4px 0; font-size: 15px; font-weight: 900; text-transform: uppercase; letter-spacing: -0.02em; font-style: italic;">Install Our App</h4>
      <p id="pwa-message" style="margin: 0; font-size: 11px; color: white; font-weight: 500; line-height: 1.3;">Get fast access to your wallet, scratch cards, and stack burgers!</p>
    </div>
    <div style="display: flex; gap: 8px; align-items: center; flex-shrink: 0;">
      <a id="pwa-action-btn" href="https://burgerstack-five.vercel.app/?source=squarespace" target="_blank" rel="noopener" style="background-color: #FFE974; color: black; border: 2px solid black; padding: 8px 14px; border-radius: 12px; font-weight: 800; font-size: 11px; text-decoration: none; text-transform: uppercase; white-space: nowrap; box-shadow: 2px 2px 0px 0px #000;">Open</a>
      <button id="pwa-close-btn" style="background: none; border: none; color: white; font-size: 22px; font-weight: bold; cursor: pointer; padding: 0 4px; line-height: 1;">&times;</button>
    </div>
  </div>
</div>

<script>
  (function() {
    var PWA_URL = 'https://burgerstack-five.vercel.app/?source=squarespace';
    var DISMISS_KEY = 'pwa_banner_dismissed';
    var DISMISS_DAYS = 7;

    function getDismissedAt() {
      var ts = localStorage.getItem(DISMISS_KEY);
      return ts ? parseInt(ts, 10) : 0;
    }

    function isDismissed() {
      var dismissedAt = getDismissedAt();
      if (!dismissedAt) return false;
      var msPerDay = 24 * 60 * 60 * 1000;
      return (Date.now() - dismissedAt) < (DISMISS_DAYS * msPerDay);
    }

    var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    if (!isMobile) return;

    var isStandalone = window.navigator.standalone || window.matchMedia('(display-mode: standalone)').matches;
    if (isStandalone) return;

    if (isDismissed()) return;

    var banner = document.getElementById('pwa-install-banner');
    var message = document.getElementById('pwa-message');
    var actionBtn = document.getElementById('pwa-action-btn');
    var closeBtn = document.getElementById('pwa-close-btn');

    var isIOS = /iPhone|iPad|iPod/i.test(navigator.userAgent);
    if (isIOS) {
      message.innerHTML = 'Tap <strong>"Open"</strong>, then press the <strong>Share</strong> button <span style="font-size: 14px;">⎋</span> and select <strong>"Add to Home Screen"</strong>.';
      actionBtn.innerHTML = 'Play App';
    } else {
      message.innerHTML = 'Play Burger Slinger & redeem rewards directly from your home screen!';
      actionBtn.innerHTML = 'Install App';
    }

    actionBtn.href = PWA_URL;

    closeBtn.addEventListener('click', function() {
      banner.style.display = 'none';
      localStorage.setItem(DISMISS_KEY, Date.now().toString());
    });

    setTimeout(function() {
      banner.style.display = 'block';
    }, 2000);
  })();
</script>
